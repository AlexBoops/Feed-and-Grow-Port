<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Feed & Grow: Fish</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231f20;
      }
      #unity-container {
        width: 100% !important;
        height: 100% !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
      }
      #unity-canvas {
        width: 100% !important;
        height: 100% !important;
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Feed & Grow: Fish</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      const jsdelivrRepoBase = "https://cdn.jsdelivr.net/gh/AlexBoops/Feed-and-Grow-Port@main";
      const jsdelivrBuildUrl = `${jsdelivrRepoBase}/Build`;

      // Backoff retry helper for CDN fetches
      async function fetchChunkWithRetry(chunkUrl, retries = 6, delayMs = 5000) {
        for (let attempt = 1; attempt <= retries; attempt++) {
          try {
            const res = await fetch(chunkUrl);
            const contentType = res.headers.get("content-type") || "";

            if (res.ok && !contentType.includes("text/html")) {
              const buf = await res.arrayBuffer();
              if (buf.byteLength > 0) return buf;
            }
            console.warn(`[jsDelivr Attempt ${attempt}/${retries}] HTTP ${res ? res.status : 'Error'} for ${chunkUrl}`);
          } catch (err) {
            console.warn(`[jsDelivr Attempt ${attempt}/${retries}] Network error for ${chunkUrl}`);
          }

          if (attempt < retries) {
            await new Promise(r => setTimeout(r, delayMs));
          }
        }
        throw new Error(`Failed to download chunk ${chunkUrl} after ${retries} attempts.`);
      }

      // Reassemble 1-based split parts (.part0001 to .part0029)
      async function assembleSplitFile(baseName, totalParts, mimeType) {
        const chunks = [];
        let totalBytes = 0;

        for (let i = 1; i <= totalParts; i++) {
          const partNum = String(i).padStart(4, '0');
          const chunkUrl = `${jsdelivrBuildUrl}/${baseName}.part${partNum}`;
          const buf = await fetchChunkWithRetry(chunkUrl);
          chunks.push(buf);
          totalBytes += buf.byteLength;
        }

        const combined = new Uint8Array(totalBytes);
        let offset = 0;
        for (const chunk of chunks) {
          combined.set(new Uint8Array(chunk), offset);
          offset += chunk.byteLength;
        }

        return URL.createObjectURL(new Blob([combined], { type: mimeType }));
      }

      async function loadGame() {
        try {
          loadingBar.style.display = "block";

          // 1. Reassemble .data.unityweb parts (29 parts)
          const dataBlobUrl = await assembleSplitFile("FeedAndGrow-Port.data.unityweb", 29, "application/octet-stream");

          // 2. Direct single file URLs
          const frameworkUrl = `${jsdelivrBuildUrl}/FeedAndGrow-Port.framework.js.unityweb`;
          const wasmUrl = `${jsdelivrBuildUrl}/FeedAndGrow-Port.wasm.unityweb`;

          // 3. Inject engine loader script dynamically
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = `${jsdelivrBuildUrl}/FeedAndGrow-Port.loader.js`;
            script.crossOrigin = "anonymous";
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Failed to load engine loader from ${jsdelivrBuildUrl}/FeedAndGrow-Port.loader.js`));
            document.body.appendChild(script);
          });

          var config = {
            dataUrl: dataBlobUrl,
            frameworkUrl: frameworkUrl,
            codeUrl: wasmUrl,
            streamingAssetsUrl: `${jsdelivrRepoBase}/StreamingAssets`,
            companyName: "OldBlood Productions",
            productName: "Feed & Grow: Fish",
            productVersion: "1.0",
            showBanner: unityShowBanner,
            matchWebGLToCanvasSize: true,
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
          };

          if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
            config.devicePixelRatio = 1;
            unityShowBanner('WebGL builds are not supported on mobile devices.', 'warning');
          }

          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (100 * progress) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            
            // Fullscreen trigger setup
            fullscreenButton.onclick = () => {
              unityInstance.SetFullscreen(1);
            };

            // Lock focus to canvas
            canvas.focus();
          }).catch((message) => {
            unityShowBanner(message, 'error');
          });

        } catch (err) {
          unityShowBanner("Failed to load game assets: " + err.message, 'error');
        }
      }

      loadGame();
    </script>
  </body>
</html>
